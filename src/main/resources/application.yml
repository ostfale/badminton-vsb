spring:
  application:
    name: badminton-vsb

server:
  port: ${PORT:8181}

logging:
  level:
    org:
      atmosphere: warn

vaadin:
  launch-browser: false                                                            # Launch browser when starting the application.
  allowed-packages: com.vaadin,org.vaadin,com.flowingcode,com.github.appreciated,de.ostfale.va
  version: '@vaadin.version@'
  copilot:
    enabled: false

application:
  version: '@project.version@'

management:
  server:
    port: ${PORT:8081}
  endpoints:
    web:
      base-path: /mgmt
      exposure:
        include: info,health,prometheus
  endpoint:
    health:
      show-details: always


org:
  eclipse:
    store:
      storage-directory: ${user.home}/.badminton-vsb/data

app:
  download:
    ranking:
      schedule: 0 44 4 * * *
    tournaments:
      schedule: 0 33 3 * * *
